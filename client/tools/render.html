<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Star Apps · render de escenas pixel</title>
<!-- Dev-only page (not part of the production build). Renders an area scene at 1280x720
     for social videos: /tools/render.html?scene=finanzas&lang=es -->
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; background: #070B14; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #070B14; }
  canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; image-rendering: pixelated; }
  #caption { font-variant-ligatures: none; font-feature-settings: "liga" 0; position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 40px; font-family: 'Pixelify Sans', monospace;
    background: linear-gradient(transparent, rgba(7,11,20,0.92) 35%); color: #EEF2F8; }
  #caption h1 { margin: 0 0 6px; font-size: 44px; font-weight: 700; }
  #caption p { margin: 0; font-size: 24px; color: #B4C0D3; }
  #brand { position: absolute; right: 40px; top: 28px; font-family: 'Pixelify Sans', monospace; font-size: 26px; font-weight: 700; color: #EEF2F8; letter-spacing: 2px; }
  #brand span { color: #47E5C2; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="160" height="90"></canvas>
  <div id="brand">STAR <span>APPS</span></div>
  <div id="caption"><h1 id="name"></h1><p id="pitch"></p></div>
</div>
<script type="module">
  import { AREA_SCENE_DEFS } from '/src/components/pixel/areaScenes.ts';
  import { areas } from '/src/data/areas.ts';

  import * as E from '/src/components/pixel/engine.ts';
  import * as R from '/src/components/pixel/rig.ts';
  const params = new URLSearchParams(location.search);
  const id = params.get('scene') || 'finanzas';
  // Character lineup for reviewing the rig: /tools/render.html?scene=lineup
  const lineupScene = (g, t) => {
    E.setCtx(g);
    E.rect(0, 0, 256, 144, '#1A2745');
    E.rect(0, 110, 256, 34, '#553824');
    const cast = [
      [{ skin: 'light', hair: 'bun', outfit: 'office' }, 'stand', 'tired'],
      [{ skin: 'medium', hair: 'short', outfit: 'vest', headwear: 'helmet', bag: true }, 'walk', 'focus'],
      [{ skin: 'dark', hair: 'curly', outfit: 'operator', headwear: 'headset' }, 'phone', 'stressed'],
      [{ skin: 'light', hair: 'short', outfit: 'blazer', glasses: true }, 'thumbsup', 'happy'],
      [{ skin: 'medium', hair: 'ponytail', outfit: 'cardigan' }, 'wave', 'relieved'],
      [{ skin: 'dark', hair: 'short', outfit: 'vest', headwear: 'helmet' }, 'repair', 'focus'],
      [{ skin: 'light', hair: 'curly', outfit: 'office', hairColor: 'brown' }, 'point', 'surprised'],
      [{ skin: 'medium', hair: 'bun', outfit: 'blazer', hairColor: 'black' }, 'stretch', 'happy'],
    ];
    cast.forEach(([look, pose, mood], i) => R.drawStanding(look, pose, mood, 6 + i * 31, 50, t, false));
    E.rect(0, 0, 256, 1, '#000');
  };
  const seatedScene = (g, t) => {
    E.setCtx(g);
    E.rect(0, 0, 256, 144, '#1A2745');
    E.rect(0, 110, 256, 34, '#553824');
    const cast = [
      [{ skin: 'light', hair: 'bun', outfit: 'office' }, 'type', 'tired'],
      [{ skin: 'medium', hair: 'short', outfit: 'vest' }, 'sleep', 'sleep'],
      [{ skin: 'dark', hair: 'curly', outfit: 'operator', headwear: 'headset' }, 'phone', 'stressed'],
      [{ skin: 'light', hair: 'ponytail', outfit: 'cardigan' }, 'coffee', 'happy'],
      [{ skin: 'medium', hair: 'short', outfit: 'blazer', glasses: true }, 'watch', 'focus'],
    ];
    cast.forEach(([look, pose, mood], i) => { R.drawChair(4 + i * 50, 58); R.drawSeated(look, pose, mood, 10 + i * 50, 56, t, { sip: 0.5 }); if (pose === 'sleep') R.zzz(34 + i * 50, 60, t); });
  };
  if (id === 'lineup' || id === 'seated') {
    const cv0 = document.getElementById('c'); cv0.width = 256; cv0.height = 144;
    document.getElementById('caption').style.display = 'none'; document.getElementById('brand').style.display = 'none';
    const g0 = cv0.getContext('2d'); g0.imageSmoothingEnabled = false;
    window.DURATION = 4;
    window.renderFrame = (t) => (id === 'lineup' ? lineupScene : seatedScene)(g0, t);
    window.renderFrame(0.3);
    window.READY = true;
    throw new Error('lineup mode');
  }
  const lang = params.get('lang') === 'en' ? 'en' : 'es';
  const hq = id.endsWith('-hq');
  const areaId = hq ? id.replace(/-hq$/, '') : id;
  const area = areas.find((a) => a.id === areaId);
  // every area has a story scene now; "<area>-hq" is still accepted for older links
  const def = AREA_SCENE_DEFS[areaId];
  const cv = document.getElementById('c');
  cv.width = def.w; cv.height = def.h;
  const showCaption = !params.has('nocaption');
  document.getElementById('caption').style.display = showCaption ? '' : 'none';
  document.getElementById('brand').style.display = showCaption ? '' : 'none';
  document.getElementById('name').textContent = area.name[lang];
  document.getElementById('name').style.color = area.color;
  document.getElementById('pitch').textContent = area.pitch[lang];
  const g = cv.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingEnabled = false;

  window.DURATION = def.loop;
  window.renderFrame = (t) => { g.clearRect(0, 0, def.w, def.h); def.scene(g, t, undefined); };
  if (!params.has('record')) {
    const t0 = performance.now();
    const loop = () => { window.renderFrame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } else {
    window.renderFrame(0);
  }
  window.READY = true;
</script>
</body>
</html>
