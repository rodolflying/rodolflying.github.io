<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#070B14" />
    <!--
      Static defaults for crawlers that don't run JS (WhatsApp, LinkedIn, Slack previews).
      data-rh lets react-helmet-async take them over once the app mounts, so they are
      replaced per page instead of duplicated.
    -->
    <title>Star Apps | Automatización para que tu equipo dirija</title>
    <meta data-rh="true" name="description" content="Automatizamos las tareas repetitivas entre ERP, planillas, correo y portales para que tu equipo revise, apruebe y decida. Medido antes y después, con el código a nombre de tu empresa." />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="Star Apps" />
    <meta data-rh="true" property="og:title" content="Star Apps | Automatización para que tu equipo dirija" />
    <meta data-rh="true" property="og:description" content="Automatizamos las tareas repetitivas entre ERP, planillas, correo y portales para que tu equipo revise, apruebe y decida. Medido antes y después, con el código a nombre de tu empresa." />
    <meta data-rh="true" property="og:url" content="%VITE_SITE_URL%/" />
    <meta data-rh="true" property="og:image" content="%VITE_SITE_URL%/og-default.png" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
